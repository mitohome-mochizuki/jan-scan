<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>物品棚卸し</title><script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#f3f7f5;color:#163d33;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.wrap{max-width:650px;margin:auto}h1{font-size:25px;margin:10px 0 14px}.card{background:#fff;padding:16px;margin-bottom:14px;border-radius:18px;box-shadow:0 3px 14px #00000012}.title{font-size:18px;font-weight:700;margin-bottom:10px}.photo{display:block;width:100%;padding:20px 14px;border-radius:15px;background:#17735c;color:#fff;text-align:center;font-size:21px;font-weight:800}.photo small{display:block;font-size:13px;font-weight:400;margin-top:5px}#photoInput{display:none}.status{text-align:center;margin-top:10px;font-size:14px;color:#64746f}.success{color:#14705a;font-weight:700}.error{color:#b3261e;font-weight:700}.row{display:flex;gap:8px}.row input{flex:1}input{width:100%;padding:13px;border:1px solid #cad6d2;border-radius:11px;font-size:17px}button{border:0;border-radius:11px;background:#17735c;color:#fff;font-weight:700;font-size:16px;padding:13px}.search{white-space:nowrap}.items{display:flex;flex-direction:column;gap:10px}.item{border:1px solid #dce7e3;border-radius:14px;padding:13px}.itemTop{display:flex;justify-content:space-between;gap:10px}.name{font-size:17px;font-weight:700}.jan{font-size:12px;color:#73827d;margin-top:4px}.counter{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:10px}.counter button{width:44px;height:44px;padding:0;font-size:24px}.count{min-width:38px;text-align:center;font-size:22px;font-weight:800}.remove{background:#7b8985;font-size:13px;padding:8px 10px}.empty{text-align:center;color:#788782;padding:18px 0}.summary{font-size:15px;margin-bottom:10px}.confirm{width:100%;font-size:19px;padding:16px}.confirm:disabled{opacity:.5}.secondary{width:100%;margin-top:9px;background:#667b75}.note{font-size:12px;color:#788782;margin-top:8px;line-height:1.5}</style></head><body><div class="wrap"><h1>📦 物品棚卸し</h1><div class="card"><div class="title">バーコードを撮影</div><label class="photo" for="photoInput">📸 バーコードを撮影<small>撮影 → 自動解析 → 数量＋1</small></label><input id="photoInput" type="file" accept="image/*" capture="environment"><div id="status" class="status">バーコードが大きく写るように撮影してください</div><div class="row" style="margin-top:12px"><input id="manualJan" inputmode="numeric" placeholder="読めない時はJANを手入力"><button class="search" onclick="addManual()">追加</button></div></div><div class="card"><div class="title">今回の棚卸し</div><div id="summary" class="summary">0種類 / 合計0</div><div id="items" class="items"><div class="empty">まだ物品がありません</div></div></div><div class="card"><div class="title">棚卸しを確定</div><input id="staff" placeholder="担当者 例：望月"><button id="confirm" class="confirm" onclick="confirmInventory()">まとめてスプレッドシートへ反映</button><button class="secondary" onclick="clearAll()">今回のリストをすべて消す</button><div class="note">同じJANをもう一度撮影すると数量が＋1されます。数量は＋／－で修正できます。確定するまではGoogleスプレッドシートへ送信されません。</div><p id="message"></p></div></div><script>
const API='https://script.google.com/macros/s/AKfycbzBN2o964sOYAe8-m93Q_Tvt5eYn-V11LpHvtm3-hKMOVQUjzIlko8qX0RdeYHZkJjEDA/exec';const inventory=new Map();
function makeReader(){const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13]);hints.set(ZXing.DecodeHintType.TRY_HARDER,true);hints.set(ZXing.DecodeHintType.ALSO_INVERTED,true);return new ZXing.BrowserMultiFormatReader(hints)}
document.getElementById('photoInput').addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;setStatus('写真を解析しています…');const url=URL.createObjectURL(file);try{const reader=makeReader();const result=await reader.decodeFromImageUrl(url);const code=String(result.getText()).trim();if(!/^\d{13}$/.test(code))throw new Error('JAN13以外');await addJan(code);setStatus('✓ 読み取り成功：'+code,false,true);if(navigator.vibrate)navigator.vibrate([70,35,70])}catch(err){console.error(err);setStatus('読み取れませんでした。バーコードを大きく写して再撮影してください',true)}finally{URL.revokeObjectURL(url);e.target.value=''}});
async function addManual(){const el=document.getElementById('manualJan'),code=el.value.trim();if(!/^\d{13}$/.test(code)){setStatus('13桁のJANコードを入力してください',true);return}await addJan(code);el.value=''}
async function addJan(code){setStatus('商品を確認しています…');if(inventory.has(code)){inventory.get(code).qty++;render();setStatus('✓ 同じ商品を＋1しました',false,true);return}try{const r=await fetch(API+'?action=find&jan='+encodeURIComponent(code));const d=await r.json();inventory.set(code,{jan:code,name:d.found?d.product:'未登録JAN',spec:d.found?(d.spec||''):'物品マスター未登録',qty:1,registered:!!d.found});render();setStatus(d.found?'✓ '+d.product+' を追加しました':'⚠️ 未登録JANを追加しました',!d.found,d.found)}catch(err){console.error(err);setStatus('商品情報の取得に失敗しました',true)}}
function changeQty(code,delta){const x=inventory.get(code);if(!x)return;x.qty+=delta;if(x.qty<=0)inventory.delete(code);render()}
function removeItem(code){inventory.delete(code);render()}
function render(){const box=document.getElementById('items');box.innerHTML='';let total=0;if(!inventory.size)box.innerHTML='<div class="empty">まだ物品がありません</div>';for(const [code,x] of inventory){total+=x.qty;const div=document.createElement('div');div.className='item';div.innerHTML='<div class="itemTop"><div><div class="name">'+esc(x.name)+'</div><div class="jan">JAN '+esc(code)+(x.spec?' / '+esc(x.spec):'')+'</div></div><button class="remove" onclick="removeItem(\''+code+'\')">削除</button></div><div class="counter"><button onclick="changeQty(\''+code+'\',-1)">−</button><div class="count">'+x.qty+'</div><button onclick="changeQty(\''+code+'\',1)">＋</button></div>';box.appendChild(div)}document.getElementById('summary').textContent=inventory.size+'種類 / 合計'+total}
async function confirmInventory(){if(!inventory.size){showMessage('棚卸しする物品がありません',true);return}const staff=document.getElementById('staff').value.trim(),btn=document.getElementById('confirm');btn.disabled=true;btn.textContent='反映中…';let ok=0,fail=0;try{for(const x of inventory.values()){try{const url=API+'?action=save&jan='+encodeURIComponent(x.jan)+'&operation='+encodeURIComponent('棚卸し')+'&qty='+encodeURIComponent(x.qty)+'&staff='+encodeURIComponent(staff);const r=await fetch(url),d=await r.json();if(d.success)ok++;else fail++}catch(e){fail++}}if(fail===0){showMessage('✓ '+ok+'種類を反映しました',false);inventory.clear();render()}else showMessage(ok+'種類反映 / '+fail+'種類失敗。失敗分を確認してください',true)}finally{btn.disabled=false;btn.textContent='まとめてスプレッドシートへ反映'}}
function clearAll(){if(!inventory.size)return;if(confirm('今回の棚卸しリストをすべて消しますか？')){inventory.clear();render();showMessage('',false)}}
function setStatus(t,err=false,success=false){const e=document.getElementById('status');e.textContent=t;e.className='status '+(err?'error':success?'success':'')}
function showMessage(t,err){const e=document.getElementById('message');e.textContent=t;e.className=err?'error':'success'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script></body></html>
