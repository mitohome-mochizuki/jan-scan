<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JANスキャン</title><script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#f3f7f5;color:#163d33;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.container{max-width:650px;margin:auto}h1{font-size:25px}.card{background:#fff;padding:16px;margin-bottom:14px;border-radius:18px;box-shadow:0 3px 14px #00000012}.title{font-size:18px;font-weight:700;margin-bottom:10px}.camera{position:relative;width:100%;aspect-ratio:4/3;background:#111;border-radius:14px;overflow:hidden}.camera video{width:100%;height:100%;object-fit:cover}.guide{position:absolute;left:5%;right:5%;top:38%;height:24%;border:3px solid #fff;border-radius:8px;pointer-events:none}.guide:after{content:"";position:absolute;left:3%;right:3%;top:50%;height:2px;background:#e33}.hint{text-align:center;font-size:14px;margin-top:8px;color:#64746f}.success{color:#14705a;font-weight:700}.error{color:#b3261e;font-weight:700}input,select{width:100%;padding:14px;margin-top:8px;border:1px solid #cad6d2;border-radius:11px;background:#fff;font-size:17px}button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:12px;background:#17735c;color:#fff;font-size:18px;font-weight:700}button.secondary{background:#536b64}button:disabled{opacity:.5}.product{display:none;margin-top:14px;padding:15px;background:#eef8f4;border-radius:12px}.product-name{font-size:19px;font-weight:700}.small{color:#64746f;font-size:14px;margin-top:6px}</style></head><body><div class="container"><h1>📦 JANスキャン</h1><div class="card"><div class="title">① JANバーコードを読み取る</div><div class="camera"><video id="video" playsinline muted></video><div class="guide"></div></div><div id="scanStatus" class="hint">カメラを起動してください</div><button id="startButton" onclick="startScanner()">📷 スキャン開始</button><button class="secondary" onclick="stopScanner()">停止</button><div class="hint">JAN-13（EAN-13）専用。赤線をバーコードの縦線と交差させてください。</div></div><div class="card"><div class="title">② 商品確認</div><input id="jan" inputmode="numeric" placeholder="JANコード"><button onclick="manualSearch()">JANコードから商品を検索</button><div id="productBox" class="product"><div id="productName" class="product-name"></div><div id="productSpec" class="small"></div><div id="productRule" class="small"></div></div></div><div class="card"><div class="title">③ スプレッドシートへ反映</div><label>操作</label><select id="operation"><option value="開封">開封</option><option value="発注依頼">発注依頼</option><option value="患者へ配布">患者へ配布</option><option value="入荷">入荷</option></select><label>数量</label><input id="qty" type="number" value="1" min="1"><label>担当者</label><input id="staff" placeholder="例：望月"><button id="saveButton" onclick="saveScan()">スプレッドシートへ反映</button><p id="message"></p></div></div><script>
const API='https://script.google.com/macros/s/AKfycbzBN2o964sOYAe8-m93Q_Tvt5eYn-V11LpHvtm3-hKMOVQUjzIlko8qX0RdeYHZkJjEDA/exec';let controls=null,lastCode='',lastTime=0,reader=null;
async function startScanner(){const status=document.getElementById('scanStatus'),btn=document.getElementById('startButton');btn.disabled=true;status.textContent='カメラを起動しています…';try{if(controls){controls.stop();controls=null}const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13]);hints.set(ZXing.DecodeHintType.TRY_HARDER,true);reader=new ZXing.BrowserMultiFormatReader(hints,100);const devices=await reader.listVideoInputDevices();let id=null;if(devices.length){const rear=devices.find(d=>/back|rear|environment|背面/i.test(d.label));id=(rear||devices[devices.length-1]).deviceId}controls=await reader.decodeFromVideoDevice(id,'video',(result,error)=>{if(result)handleResult(result.getText())});status.textContent='読み取り中… バーコードを赤線に合わせてください'}catch(e){console.error(e);status.textContent='カメラを開始できませんでした';status.className='hint error'}finally{btn.disabled=false}}
function stopScanner(){if(controls){controls.stop();controls=null}document.getElementById('scanStatus').textContent='スキャンを停止しました'}
function handleResult(text){const code=String(text).trim(),now=Date.now();if(!/^\d{13}$/.test(code)||code===lastCode&&now-lastTime<4000)return;lastCode=code;lastTime=now;document.getElementById('jan').value=code;const s=document.getElementById('scanStatus');s.textContent='✓ 読み取り成功：'+code;s.className='hint success';if(navigator.vibrate)navigator.vibrate([80,40,80]);searchProduct(code)}
function manualSearch(){const jan=document.getElementById('jan').value.trim();if(!jan){showMessage('JANコードを入力してください',true);return}searchProduct(jan)}
async function searchProduct(jan){showMessage('商品を確認しています…',false);try{const r=await fetch(API+'?action=find&jan='+encodeURIComponent(jan));const d=await r.json(),box=document.getElementById('productBox');box.style.display='block';if(!d.found){document.getElementById('productName').textContent='⚠️ 未登録JAN';document.getElementById('productSpec').textContent=jan;document.getElementById('productRule').textContent='';showMessage('物品マスターに未登録です',true);return}document.getElementById('productName').textContent=d.product;document.getElementById('productSpec').textContent=d.spec||'';document.getElementById('productRule').textContent='発注ルール：'+(d.orderRule||'未設定');showMessage('✓ 商品を確認しました',false)}catch(e){console.error(e);showMessage('商品検索に失敗しました',true)}}
async function saveScan(){const jan=document.getElementById('jan').value.trim();if(!jan){showMessage('先にJANを読み取ってください',true);return}const operation=document.getElementById('operation').value,qty=document.getElementById('qty').value,staff=document.getElementById('staff').value.trim(),button=document.getElementById('saveButton');button.disabled=true;button.textContent='反映中…';try{const url=API+'?action=save&jan='+encodeURIComponent(jan)+'&operation='+encodeURIComponent(operation)+'&qty='+encodeURIComponent(qty)+'&staff='+encodeURIComponent(staff),r=await fetch(url),d=await r.json();if(!d.success)throw new Error(d.message||'保存できませんでした');showMessage('✓ '+d.product+' を反映しました',false);document.getElementById('jan').value='';document.getElementById('productBox').style.display='none';document.getElementById('qty').value=1;lastCode=''}catch(e){console.error(e);showMessage('反映に失敗しました',true)}finally{button.disabled=false;button.textContent='スプレッドシートへ反映'}}
function showMessage(text,isError){const m=document.getElementById('message');m.textContent=text;m.className=isError?'error':'success'}
</script></body></html>
