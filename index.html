<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  <title>JANスキャン</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px;
      background: #f3f7f5;
      color: #163d33;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Helvetica Neue", sans-serif;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      font-size: 26px;
      margin: 12px 0 20px;
    }

    .card {
      background: white;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 18px;
      box-shadow: 0 3px 14px rgba(0,0,0,.07);
    }

    .title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: 1px solid #cad6d2;
      border-radius: 11px;
      background: white;
      font-size: 17px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      background: #17735c;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .5;
    }

    .product {
      display: none;
      margin-top: 14px;
      padding: 15px;
      background: #eef8f4;
      border-radius: 12px;
    }

    .product-name {
      font-size: 19px;
      font-weight: bold;
    }

    .small {
      color: #64746f;
      font-size: 14px;
      margin-top: 6px;
    }

    .success {
      color: #14705a;
      font-weight: bold;
    }

    .error {
      color: #b3261e;
      font-weight: bold;
    }

    #lastScan {
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📦 JANスキャン</h1>

  <div class="card">

    <div class="title">
      ① バーコードを読み取る
    </div>

    <div id="reader"></div>

    <div id="lastScan" class="small">
      カメラを起動してJANコードを映してください
    </div>

  </div>


  <div class="card">

    <div class="title">
      ② 商品確認
    </div>

    <input
      id="jan"
      inputmode="numeric"
      placeholder="JANコード">

    <button onclick="manualSearch()">
      JANコードから商品を検索
    </button>


    <div id="productBox" class="product">

      <div
        id="productName"
        class="product-name">
      </div>

      <div
        id="productSpec"
        class="small">
      </div>

      <div
        id="productRule"
        class="small">
      </div>

    </div>

  </div>


  <div class="card">

    <div class="title">
      ③ スプレッドシートへ反映
    </div>


    <label>操作</label>

    <select id="operation">

      <option value="開封">
        開封
      </option>

      <option value="発注依頼">
        発注依頼
      </option>

      <option value="患者へ配布">
        患者へ配布
      </option>

      <option value="入荷">
        入荷
      </option>

    </select>


    <label>数量</label>

    <input
      id="qty"
      type="number"
      value="1"
      min="1">


    <label>担当者</label>

    <input
      id="staff"
      placeholder="例：望月">


    <button
      id="saveButton"
      onclick="saveScan()">

      スプレッドシートへ反映

    </button>


    <p id="message"></p>

  </div>

</div>


<script>

const API =
  "https://script.google.com/macros/s/AKfycbzBN2o964sOYAe8-m93Q_Tvt5eYn-V11LpHvtm3-hKMOVQUjzIlko8qX0RdeYHZkJjEDA/exec";


let lastCode = "";
let lastTime = 0;


/* ==========================
   カメラ
========================== */

function scanSuccess(decodedText) {

  const now = Date.now();

  // 同じJANの連続読取を防止
  if (
    decodedText === lastCode &&
    now - lastTime < 4000
  ) {
    return;
  }

  lastCode = decodedText;
  lastTime = now;

  document.getElementById("jan").value =
    decodedText;

  document.getElementById("lastScan")
    .textContent =
    "✓ 読み取り：" + decodedText;

  if (navigator.vibrate) {
    navigator.vibrate(100);
  }

  searchProduct(decodedText);
}


const scanner =
  new Html5QrcodeScanner(

    "reader",

    {
      fps: 10,

      qrbox: {
        width: 280,
        height: 130
      },

      rememberLastUsedCamera: true,

      supportedScanTypes: [
        Html5QrcodeScanType.SCAN_TYPE_CAMERA
      ],

      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E
      ]
    },

    false
  );


scanner.render(
  scanSuccess,
  function() {}
);


/* ==========================
   商品検索
========================== */

function manualSearch() {

  const jan =
    document.getElementById("jan")
      .value.trim();

  if (!jan) {
    showMessage(
      "JANコードを入力してください",
      true
    );
    return;
  }

  searchProduct(jan);
}


async function searchProduct(jan) {

  showMessage(
    "商品を確認しています…",
    false
  );

  try {

    const url =
      API +
      "?action=find&jan=" +
      encodeURIComponent(jan);


    const response =
      await fetch(url);


    const data =
      await response.json();


    const box =
      document.getElementById(
        "productBox"
      );


    box.style.display = "block";


    if (!data.found) {

      document.getElementById(
        "productName"
      ).textContent =
        "⚠️ 未登録JAN";


      document.getElementById(
        "productSpec"
      ).textContent =
        jan;


      document.getElementById(
        "productRule"
      ).textContent =
        "";


      showMessage(
        "物品マスターに未登録です",
        true
      );

      return;
    }


    document.getElementById(
      "productName"
    ).textContent =
      data.product;


    document.getElementById(
      "productSpec"
    ).textContent =
      data.spec || "";


    document.getElementById(
      "productRule"
    ).textContent =
      "発注ルール：" +
      (data.orderRule || "未設定");


    showMessage(
      "✓ 商品を確認しました",
      false
    );

  }

  catch (error) {

    showMessage(
      "商品検索に失敗しました",
      true
    );

    console.error(error);
  }
}


/* ==========================
   保存
========================== */

async function saveScan() {

  const jan =
    document.getElementById("jan")
      .value.trim();


  if (!jan) {

    showMessage(
      "先にJANを読み取ってください",
      true
    );

    return;
  }


  const operation =
    document.getElementById(
      "operation"
    ).value;


  const qty =
    document.getElementById(
      "qty"
    ).value;


  const staff =
    document.getElementById(
      "staff"
    ).value.trim();


  const button =
    document.getElementById(
      "saveButton"
    );


  button.disabled = true;

  button.textContent =
    "反映中…";


  try {

    const url =
      API +
      "?action=save" +
      "&jan=" +
      encodeURIComponent(jan) +
      "&operation=" +
      encodeURIComponent(operation) +
      "&qty=" +
      encodeURIComponent(qty) +
      "&staff=" +
      encodeURIComponent(staff);


    const response =
      await fetch(url);


    const data =
      await response.json();


    if (!data.success) {
      throw new Error(
        data.message ||
        "保存できませんでした"
      );
    }


    showMessage(
      "✓ " +
      data.product +
      " を反映しました",
      false
    );


    document.getElementById(
      "jan"
    ).value = "";


    document.getElementById(
      "productBox"
    ).style.display =
      "none";


    document.getElementById(
      "qty"
    ).value = 1;


    lastCode = "";


  }

  catch (error) {

    showMessage(
      "反映に失敗しました",
      true
    );

    console.error(error);

  }

  finally {

    button.disabled = false;

    button.textContent =
      "スプレッドシートへ反映";

  }
}


/* ==========================
   メッセージ
========================== */

function showMessage(
  text,
  isError
) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent = text;


  message.className =
    isError
      ? "error"
      : "success";
}

</script>

</body>
</html>
