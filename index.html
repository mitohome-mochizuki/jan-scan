<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JANスキャン</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f3f7f5;color:#163d33;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.container{max-width:650px;margin:auto}h1{font-size:25px}.card{background:#fff;padding:16px;margin-bottom:14px;border-radius:18px;box-shadow:0 3px 14px #00000012}.title{font-size:18px;font-weight:700;margin-bottom:10px}#reader{width:100%;overflow:hidden;border-radius:14px;background:#111}.hint{text-align:center;font-size:14px;margin-top:8px;color:#64746f}.scanline{font-weight:700;color:#17735c}input,select{width:100%;padding:14px;margin-top:8px;border:1px solid #cad6d2;border-radius:11px;background:#fff;font-size:17px}button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:12px;background:#17735c;color:#fff;font-size:18px;font-weight:700}button:disabled{opacity:.5}.product{display:none;margin-top:14px;padding:15px;background:#eef8f4;border-radius:12px}.product-name{font-size:19px;font-weight:700}.small{color:#64746f;font-size:14px;margin-top:6px}.success{color:#14705a;font-weight:700}.error{color:#b3261e;font-weight:700}
</style>
</head>
<body><div class="container">
<h1>📦 JANスキャン</h1>
<div class="card"><div class="title">① JANバーコードを読み取る</div><div id="reader"></div><div id="lastScan" class="hint">バーコード全体を横向きに枠へ入れてください</div><div class="hint">JAN-13 / EAN-13専用・背面カメラ優先</div></div>
<div class="card"><div class="title">② 商品確認</div><input id="jan" inputmode="numeric" placeholder="JANコード"><button onclick="manualSearch()">JANコードから商品を検索</button><div id="productBox" class="product"><div id="productName" class="product-name"></div><div id="productSpec" class="small"></div><div id="productRule" class="small"></div></div></div>
<div class="card"><div class="title">③ スプレッドシートへ反映</div><label>操作</label><select id="operation"><option value="開封">開封</option><option value="発注依頼">発注依頼</option><option value="患者へ配布">患者へ配布</option><option value="入荷">入荷</option></select><label>数量</label><input id="qty" type="number" value="1" min="1"><label>担当者</label><input id="staff" placeholder="例：望月"><button id="saveButton" onclick="saveScan()">スプレッドシートへ反映</button><p id="message"></p></div>
</div>
<script>
const API="https://script.google.com/macros/s/AKfycbzBN2o964sOYAe8-m93Q_Tvt5eYn-V11LpHvtm3-hKMOVQUjzIlko8qX0RdeYHZkJjEDA/exec";
let lastCode="",lastTime=0;
function scanSuccess(decodedText){const code=String(decodedText).trim();if(!/^\d{13}$/.test(code))return;const now=Date.now();if(code===lastCode&&now-lastTime<5000)return;lastCode=code;lastTime=now;document.getElementById('jan').value=code;document.getElementById('lastScan').innerHTML='<span class="scanline">✓ 読み取り成功：'+code+'</span>';if(navigator.vibrate)navigator.vibrate(120);searchProduct(code);}
const scanner=new Html5QrcodeScanner('reader',{fps:25,qrbox:function(w,h){return{width:Math.floor(w*0.92),height:Math.min(150,Math.floor(h*0.38))}},aspectRatio:1.777778,rememberLastUsedCamera:true,supportedScanTypes:[Html5QrcodeScanType.SCAN_TYPE_CAMERA],formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13],videoConstraints:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}},false);
scanner.render(scanSuccess,function(){});
function manualSearch(){const jan=document.getElementById('jan').value.trim();if(!jan){showMessage('JANコードを入力してください',true);return}searchProduct(jan)}
async function searchProduct(jan){showMessage('商品を確認しています…',false);try{const response=await fetch(API+'?action=find&jan='+encodeURIComponent(jan));const data=await response.json();const box=document.getElementById('productBox');box.style.display='block';if(!data.found){document.getElementById('productName').textContent='⚠️ 未登録JAN';document.getElementById('productSpec').textContent=jan;document.getElementById('productRule').textContent='';showMessage('物品マスターに未登録です',true);return}document.getElementById('productName').textContent=data.product;document.getElementById('productSpec').textContent=data.spec||'';document.getElementById('productRule').textContent='発注ルール：'+(data.orderRule||'未設定');showMessage('✓ 商品を確認しました',false)}catch(e){showMessage('商品検索に失敗しました',true);console.error(e)}}
async function saveScan(){const jan=document.getElementById('jan').value.trim();if(!jan){showMessage('先にJANを読み取ってください',true);return}const operation=document.getElementById('operation').value,qty=document.getElementById('qty').value,staff=document.getElementById('staff').value.trim(),button=document.getElementById('saveButton');button.disabled=true;button.textContent='反映中…';try{const url=API+'?action=save&jan='+encodeURIComponent(jan)+'&operation='+encodeURIComponent(operation)+'&qty='+encodeURIComponent(qty)+'&staff='+encodeURIComponent(staff);const response=await fetch(url);const data=await response.json();if(!data.success)throw new Error(data.message||'保存できませんでした');showMessage('✓ '+data.product+' を反映しました',false);document.getElementById('jan').value='';document.getElementById('productBox').style.display='none';document.getElementById('qty').value=1;lastCode=''}catch(e){showMessage('反映に失敗しました',true);console.error(e)}finally{button.disabled=false;button.textContent='スプレッドシートへ反映'}}
function showMessage(text,isError){const m=document.getElementById('message');m.textContent=text;m.className=isError?'error':'success'}
</script></body></html>
