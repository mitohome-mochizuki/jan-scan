<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>物品管理</title><script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#f3f7f5;color:#163d33;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.wrap{max-width:650px;margin:auto}h1{font-size:25px}.card{background:#fff;padding:16px;margin-bottom:14px;border-radius:18px;box-shadow:0 3px 14px #00000012}.title{font-size:18px;font-weight:700;margin-bottom:10px}.photo{display:block;width:100%;padding:20px 14px;border-radius:15px;background:#17735c;color:#fff;text-align:center;font-size:21px;font-weight:800}.photo small{display:block;font-size:13px;font-weight:400;margin-top:5px}#photoInput{display:none}.status{text-align:center;margin-top:10px;font-size:14px;color:#64746f}.success{color:#14705a;font-weight:700}.error{color:#b3261e;font-weight:700}.warn{color:#9a6700;font-weight:700}.row{display:flex;gap:8px}.row input{flex:1}input,select,textarea{width:100%;padding:13px;border:1px solid #cad6d2;border-radius:11px;font-size:17px;background:#fff}textarea{margin-top:8px;min-height:70px}button{border:0;border-radius:11px;background:#17735c;color:#fff;font-weight:700;font-size:16px;padding:13px}.search{white-space:nowrap}.items{display:flex;flex-direction:column;gap:10px}.item{border:1px solid #dce7e3;border-radius:14px;padding:13px}.item.unknown{border-color:#e0b45b;background:#fffaf0}.itemTop{display:flex;justify-content:space-between;gap:10px}.name{font-size:17px;font-weight:700}.jan{font-size:12px;color:#73827d;margin-top:4px}.counter{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:10px}.counter button{width:44px;height:44px;padding:0;font-size:24px}.count{min-width:38px;text-align:center;font-size:22px;font-weight:800}.remove{background:#7b8985;font-size:13px;padding:8px 10px}.empty{text-align:center;color:#788782;padding:18px}.summary{font-size:15px;margin-bottom:10px}.confirm,.secondary{width:100%;font-size:18px;padding:16px;margin-top:10px}.secondary{background:#667b75}.unknownBox{display:none;background:#fff7e8;border:1px solid #e7c579;border-radius:14px;padding:14px;margin-top:12px}.unknownBox button{width:100%;margin-top:10px}.note{font-size:12px;color:#788782;margin-top:8px;line-height:1.5}label.field{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}</style></head><body><div class="wrap"><h1>📦 物品管理</h1><div class="card"><div class="title">バーコードを撮影</div><label class="photo" for="photoInput">📸 バーコードを撮影<small>撮影 → JAN解析 → 数量＋1</small></label><input id="photoInput" type="file" accept="image/*" capture="environment"><div id="status" class="status">バーコードが大きく写るように撮影してください</div><div class="row" style="margin-top:12px"><input id="manualJan" inputmode="numeric" placeholder="JANを手入力"><button class="search" onclick="addManual()">追加</button></div><div id="unknownBox" class="unknownBox"><div class="warn">⚠️ 未登録JAN</div><div id="unknownJan" class="jan"></div><label class="field">物品名</label><input id="unknownName" placeholder="例：滅菌ガーゼ"><label class="field">規格・コメント</label><textarea id="unknownMemo" placeholder="例：10×10cm / 後でマスター確認"></textarea><button onclick="saveUnknownLocal()">この内容で仮登録してリストへ追加</button></div></div><div class="card"><div class="title">今回のリスト</div><div id="summary" class="summary">0種類 / 合計0</div><div id="items" class="items"><div class="empty">まだ物品がありません</div></div></div><div class="card"><div class="title">スプレッドシートへ反映</div><label class="field">操作</label><select id="operation"><option value="棚卸し">棚卸し</option><option value="開封">開封</option><option value="発注依頼">発注依頼</option><option value="入荷">入荷</option></select><label class="field">担当者</label><input id="staff" placeholder="例：望月"><button id="confirm" class="confirm" onclick="confirmList()">まとめて反映</button><button class="secondary" onclick="clearAll()">今回のリストをすべて消す</button><div class="note">同じJANを再度撮影すると＋1。数量は＋／－で修正できます。未登録JANはスマホで物品名・コメントを仮入力できます。</div><p id="message"></p></div></div><script>
const API='https://script.google.com/macros/s/AKfycbzBN2o964sOYAe8-m93Q_Tvt5eYn-V11LpHvtm3-hKMOVQUjzIlko8qX0RdeYHZkJjEDA/exec';const inventory=new Map();let pendingUnknown='';
function makeReader(){const h=new Map();h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13]);h.set(ZXing.DecodeHintType.TRY_HARDER,true);h.set(ZXing.DecodeHintType.ALSO_INVERTED,true);return new ZXing.BrowserMultiFormatReader(h)}
document.getElementById('photoInput').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;setStatus('写真を解析しています…');const u=URL.createObjectURL(f);try{const r=await makeReader().decodeFromImageUrl(u),code=String(r.getText()).trim();if(!/^\d{13}$/.test(code))throw new Error();await addJan(code);if(navigator.vibrate)navigator.vibrate([70,35,70])}catch(err){setStatus('読み取れませんでした。バーコードを大きく写して再撮影してください',true)}finally{URL.revokeObjectURL(u);e.target.value=''}});
async function addManual(){const e=document.getElementById('manualJan'),c=e.value.trim();if(!/^\d{13}$/.test(c)){setStatus('13桁のJANを入力してください',true);return}await addJan(c);e.value=''}
async function addJan(code){hideUnknown();if(inventory.has(code)){inventory.get(code).qty++;render();setStatus('✓ 同じ商品を＋1しました',false,true);return}setStatus('商品を確認しています…');try{const r=await fetch(API+'?action=find&jan='+encodeURIComponent(code)),d=await r.json();if(d.found){inventory.set(code,{jan:code,name:d.product,spec:d.spec||'',qty:1,registered:true});render();setStatus('✓ '+d.product+' を追加しました',false,true)}else{pendingUnknown=code;document.getElementById('unknownJan').textContent='JAN '+code;document.getElementById('unknownName').value='';document.getElementById('unknownMemo').value='';document.getElementById('unknownBox').style.display='block';setStatus('未登録JANです。物品名を入力してください',false)}}catch(e){setStatus('商品情報の取得に失敗しました',true)}}
function saveUnknownLocal(){const name=document.getElementById('unknownName').value.trim(),memo=document.getElementById('unknownMemo').value.trim();if(!name){setStatus('物品名を入力してください',true);return}inventory.set(pendingUnknown,{jan:pendingUnknown,name:name,spec:memo,qty:1,registered:false});pendingUnknown='';hideUnknown();render();setStatus('✓ 未登録物品を仮登録しました',false,true)}function hideUnknown(){document.getElementById('unknownBox').style.display='none'}
function changeQty(c,d){const x=inventory.get(c);if(!x)return;x.qty+=d;if(x.qty<=0)inventory.delete(c);render()}function removeItem(c){inventory.delete(c);render()}
function render(){const b=document.getElementById('items');b.innerHTML='';let total=0;if(!inventory.size)b.innerHTML='<div class="empty">まだ物品がありません</div>';for(const [c,x] of inventory){total+=x.qty;const d=document.createElement('div');d.className='item'+(x.registered?'':' unknown');d.innerHTML='<div class="itemTop"><div><div class="name">'+esc(x.name)+(x.registered?'':' <span class="warn">（仮）</span>')+'</div><div class="jan">JAN '+esc(c)+(x.spec?' / '+esc(x.spec):'')+'</div></div><button class="remove" onclick="removeItem(\''+c+'\')">削除</button></div><div class="counter"><button onclick="changeQty(\''+c+'\',-1)">−</button><div class="count">'+x.qty+'</div><button onclick="changeQty(\''+c+'\',1)">＋</button></div>';b.appendChild(d)}document.getElementById('summary').textContent=inventory.size+'種類 / 合計'+total}
async function confirmList(){if(!inventory.size){showMessage('反映する物品がありません',true);return}const op=document.getElementById('operation').value,staff=document.getElementById('staff').value.trim(),btn=document.getElementById('confirm');btn.disabled=true;btn.textContent='反映中…';let ok=0,fail=0;try{for(const x of inventory.values()){try{let u=API+'?action=save&jan='+encodeURIComponent(x.jan)+'&operation='+encodeURIComponent(op)+'&qty='+encodeURIComponent(x.qty)+'&staff='+encodeURIComponent(staff);if(!x.registered){u+='&productName='+encodeURIComponent(x.name)+'&memo='+encodeURIComponent(x.spec||'')}const r=await fetch(u),d=await r.json();d.success?ok++:fail++}catch(e){fail++}}if(!fail){showMessage('✓ '+op+'：'+ok+'種類を反映しました',false);inventory.clear();render()}else showMessage(ok+'種類反映 / '+fail+'種類失敗',true)}finally{btn.disabled=false;btn.textContent='まとめて反映'}}
function clearAll(){if(inventory.size&&confirm('今回のリストをすべて消しますか？')){inventory.clear();render()}}function setStatus(t,err=false,success=false){const e=document.getElementById('status');e.textContent=t;e.className='status '+(err?'error':success?'success':'')}function showMessage(t,err){const e=document.getElementById('message');e.textContent=t;e.className=err?'error':'success'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();
</script></body></html>
